# BuildStart.io customizations — layered on top of the official docker-compose.yml
# Loaded automatically by docker compose.

services:
  studio:
    # Expose Studio on host port 3030 by default (change using STUDIO_PORT env var)
    ports:
      - "${STUDIO_PORT:-3030}:3000"

  functions:
    environment:
      # ── BuildStart.io edge function secrets ──────────────────────────────────
      AI_GENERATE_URL: ${AI_GENERATE_URL}
      BOT_API_KEY: ${BOT_API_KEY}
      WAHA_BASE_URL: ${WAHA_BASE_URL:-http://waha:3000}
      WAHA_API_KEY: ${WAHA_API_KEY:-buildstart_waha_api_secr3t_123}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-http://localhost:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-supa-storage}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-secret1234}
      MINIO_REGION: ${MINIO_REGION:-us-east-1}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${FIREBASE_SERVICE_ACCOUNT_JSON:-}
      WEBHOOK_URL_OVERRIDE: "https://reliability-font-zone-cowboy.trycloudflare.com/functions/v1/webhook-wsender_top_cloth"

  minio:
    container_name: supabase-minio
    image: elestio/minio:latest
    restart: unless-stopped
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-supa-storage}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-secret1234}
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"

  waha:
    container_name: waha
    image: devlikeapro/waha:latest
    restart: unless-stopped
    ports:
      - "${WAHA_PORT:-3000}:3000"
    environment:
      WHATSAPP_API_KEY: ${WAHA_API_KEY:-buildstart_waha_api_secr3t_123}
      WHATSAPP_DEFAULT_ENGINE: WEBJS

volumes:
  minio-data:
